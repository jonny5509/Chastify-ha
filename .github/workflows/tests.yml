name: Integration tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pytest-homeassistant-custom-component

      - name: Run regression tests
        run: PYTHONPATH="$GITHUB_WORKSPACE" pytest -q
